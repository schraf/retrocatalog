<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NES Catalog</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e04a5f'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='36' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">NES</span>
    <span class="brand-name">Catalog</span>
  </div>

  <label class="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m16.5 16.5 4 4"></path>
    </svg>
    <input id="search" type="search" placeholder="Search titles, publishers, developers" autocomplete="off" spellcheck="false" aria-label="Search games">
    <kbd>/</kbd>
  </label>

  <div class="top-actions">
    <button id="favorites-toggle" class="button ghost" type="button" aria-pressed="false">
      <span class="star" aria-hidden="true">★</span> Favorites
      <span id="favorites-count" class="count">0</span>
    </button>
    <a id="export" class="button" href="/api/favorites/export" download>Export</a>
  </div>
</header>

<section class="controls" aria-label="Filters">
  <div class="control-group genres">
    <span class="control-label">Genre</span>
    <div id="genre-chips" class="chips"></div>
  </div>

  <div class="control-row">
    <label class="field">
      <span class="control-label">From</span>
      <select id="year-min"></select>
    </label>
    <label class="field">
      <span class="control-label">To</span>
      <select id="year-max"></select>
    </label>
    <label class="field rating-field">
      <span class="control-label">Rating <output id="rating-output">Any</output></span>
      <input id="rating-min" type="range" min="0" max="5" step="0.1" value="0">
    </label>
    <div class="field">
      <span class="control-label">Sort</span>
      <span class="sort-row">
        <select id="sort">
          <option value="name">Name</option>
          <option value="year">Year</option>
          <option value="top">Top rated</option>
          <option value="rating">Average rating</option>
          <option value="popular">Popular</option>
          <option value="genre">Genre</option>
        </select>
        <button id="sort-direction" class="button icon" type="button" aria-label="Sort ascending">↑</button>
      </span>
    </div>
    <button id="clear-filters" class="button ghost clear" type="button">Clear filters</button>
  </div>
</section>

<main>
  <p id="status" class="statusbar" role="status" aria-live="polite">Loading catalog…</p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>No games match these filters.</p>
    <button id="empty-clear" class="button" type="button">Clear filters</button>
  </div>
</main>

<div id="backdrop" class="backdrop" hidden></div>

<aside id="panel" class="panel" role="dialog" aria-modal="false" aria-label="Game details" aria-hidden="true" tabindex="-1" inert>
  <div class="panel-bar">
    <div class="panel-nav">
      <button id="prev-game" class="button icon" type="button" aria-label="Previous game">←</button>
      <button id="next-game" class="button icon" type="button" aria-label="Next game">→</button>
    </div>
    <button id="close-panel" class="button icon" type="button" aria-label="Close details">✕</button>
  </div>

  <div class="panel-body">
    <div class="panel-art">
      <img id="detail-box" alt="">
    </div>

    <div class="panel-head">
      <h2 id="detail-title">—</h2>
      <p id="detail-sub" class="muted"></p>
      <p id="detail-rating" class="rating-line" hidden></p>
    </div>

    <button id="detail-favorite" class="button detail-favorite" type="button" aria-pressed="false">☆ Add to favorites</button>

    <dl id="detail-facts" class="facts"></dl>
    <div id="detail-tags" class="tags"></div>

    <section class="overview">
      <h3>Overview</h3>
      <p id="detail-overview" class="muted"></p>
    </section>

    <figure class="screenshot">
      <button id="screenshot-button" class="screenshot-button" type="button" aria-label="Enlarge screenshot">
        <img id="detail-shot" alt="">
      </button>
      <figcaption class="muted">Gameplay screenshot</figcaption>
    </figure>
  </div>
</aside>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="button icon lightbox-close" type="button" aria-label="Close image">✕</button>
  <img id="lightbox-image" alt="">
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="noscript">This catalog needs JavaScript enabled.</p></noscript>

<script src="/static/app.js" defer></script>
</body>
</html>
